name: Review feedback
description: Submit non-sensitive critical feedback on the documentation package.
title: "[Review] "
labels:
  - review-feedback
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, personal data, private messages, customer material, or real incident details.
  - type: dropdown
    id: reviewer_role
    attributes:
      label: Reviewer perspective
      options:
        - Security architecture
        - Technical architecture
        - AI governance
        - Governance, risk, or compliance
        - Privacy or legal review
        - Commercial or buyer perspective
        - Other external review
    validations:
      required: true
  - type: input
    id: document
    attributes:
      label: Affected document
      placeholder: Governance-First-Security-Architecture-...-v0.1.md
    validations:
      required: true
  - type: input
    id: section
    attributes:
      label: Affected section
    validations:
      required: true
  - type: textarea
    id: finding
    attributes:
      label: Finding
      description: Explain the ambiguity, risk, contradiction, overclaim, missing boundary, or scope concern.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Why it matters
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: Recommended change or blocker
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Submission boundary
      options:
        - label: I have not included secrets, personal data, private messages, customer material, or real incident details.
          required: true
        - label: I understand that feedback is not implementation, security, compliance, or production approval.
          required: true
