# Governance Decision Simulator — Synthetic Test Case Set
# Phase 2 — STC-001 through STC-015 (reconciled to canonical vocabulary under GFSA-REV-016)
#
# SYNTHETIC DATA ONLY.
# All identifiers, roles, assets, and values are invented.
# No real data, no real identifiers, no real systems.
# SIMULATED_DECISION_ONLY
#
# Catalogue note (GFSA-REV-016, issue #9):
#   STC-001..STC-015 is reserved for this executed simulator suite.
#   The 24 documentary reference cases in Synthetic-Test-Case-Set-v0.1 use DOC-TC-001..DOC-TC-024.
#
# Vocabulary note (GFSA-REV-016, issue #8):
#   All lifecycle modes, operational decision modes, and stop states follow
#   Mode-Model-Normalization-v0.1 and Stop-State-Registry-v0.1.

test_cases:

