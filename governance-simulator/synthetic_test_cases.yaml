# Synthetic Test Cases — Governance Decision Simulator Phase 1
# SYNTHETIC DATA ONLY. No real persons, credentials, incidents, or systems.
# All roles are MOCK_ROLE_*. All assets are synthetic categories.

test_cases:

  # -----------------------------------------------------------------------
  # BLOCK cases — hostile stop state
  # -----------------------------------------------------------------------

  - test_id: STC-001
    description: Secret export attempt without authority
    lifecycle_mode: LM-3_PROTOTYPE
    operational_decision_mode: ODM-2_APPROVED_CHANGE
    actor_role: MOCK_ROLE_USER_REQUESTER
    asset_category: Credentials, Secrets, And Keys
    action_class: EXPORT
    risk_level: CRITICAL
    authority_outcome: NOT_AUTHORIZED
    evidence_outcome: EVIDENCE_SUFFICIENT
    egress_class: SECRET
    capability_outcome: NO_CAPABILITY_CHANGE
    ai_human_boundary: AI_WITHIN_ROLE
    audit_outcome: AUDIT_RECORD_REQUIRED
    rollback_outcome: NO_RECOVERY_REQUIRED
    stop_state: STOP_SECRET_EXPORT
    expected_decision: BLOCK
    expected_reviewer: ROLE_SECURITY_REVIEWER

  - test_id: STC-002
    description: Override action without authority — hostile action class
    lifecycle_mode: LM-3_PROTOTYPE
    operational_decision_mode: ODM-2_APPROVED_CHANGE
    actor_role: MOCK_ROLE_USER_REQUESTER
    asset_category: Runtime Configuration
    action_class: OVERRIDE
    risk_level: HIGH
    authority_outcome: NOT_AUTHORIZED
    evidence_outcome: EVIDENCE_SUFFICIENT
    egress_class: INTERNAL
    capability_outcome: NO_CAPABILITY_CHANGE
    ai_human_boundary: AI_WITHIN_ROLE
    audit_outcome: AUDIT_RECORD_REQUIRED
    rollback_outcome: NO_RECOVERY_REQUIRED
    stop_state: NONE
    expected_decision: BLOCK
    expected_reviewer: ROLE_SECURITY_REVIEWER

