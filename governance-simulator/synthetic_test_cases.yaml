    description: >-
      Compound hostile signal — four simultaneous indicators
      (STOP_SECRET_EXPORT + EXPORT + CRITICAL + SECRET egress) —
      compound detection fires before individual stop-state check —
      must return INCIDENT_RESPONSE (STOP_COMPOUND_HOSTILE_SIGNAL).
    lifecycle_mode: LM-3_LIMITED_SYNTHETIC_PROTOTYPE
    operational_decision_mode: ODM-5_APPROVED_SYNTHETIC_PROTOTYPE_ACTION
    actor_role: ROLE_AGENT_SYNTHETIC
    asset_category: SECRET
    action_class: EXPORT
    risk_level: CRITICAL
    authority_outcome: NOT_AUTHORIZED
    evidence_outcome: EVIDENCE_PRESENT
    egress_class: SECRET
    stop_state: STOP_SECRET_EXPORT
    capability_outcome: NO_CHANGE
    ai_human_boundary: WITHIN_ROLE
    audit_outcome: AUDIT_RECORD_PRESENT
    rollback_outcome: NO_RECOVERY_REQUIRED
    expected_decision: INCIDENT_RESPONSE
    expected_stop_state: STOP_COMPOUND_HOSTILE_SIGNAL
    expected_reviewer: ROLE_SECURITY_REVIEWER
    phase: PHASE_1
    non_use_statement: >-
      This test case uses a synthetic stop state label only.
      No real secret, real export destination, or real egress route is used or implied.

